name: cwp_analysis
channels:
  - conda-forge
  - defaults

dependencies:
  # ── Python ────────────────────────────────────────────────────────────────
  - python=3.11

  # ── Core scientific stack ─────────────────────────────────────────────────
  - numpy
  - scipy

  # ── Spatial / raster ──────────────────────────────────────────────────────
  - rasterio
  - shapely
  - geopandas
  - pyproj

  # ── Dask — parallel raster operations ────────────────────────────────────
  - dask
  - distributed           # dask distributed scheduler
  - dask-jobqueue         # SLURM/PBS integration for HPC

  # ── Parallel execution ────────────────────────────────────────────────────
  - joblib

  # ── Sensitivity analysis ──────────────────────────────────────────────────
  - pip:
    - SALib               # Sobol + eFAST indices
    - chaospy             # polynomial chaos expansion surrogate modelling

  # ── Optional: surrogate modelling ────────────────────────────────────────
  - scikit-learn          # Gaussian process, random forest surrogates
  - pip:
    - GPy                 # full Gaussian process emulation

  # ── Utilities ─────────────────────────────────────────────────────────────
  - tqdm                  # progress bars for long runs
  - pandas
  - pip:
    - dask-geopandas      # parallel vector operations (optional)
    - exactextract        # fast zonal statistics (C++ backed)

  # ── Dev / profiling ───────────────────────────────────────────────────────
  - ipython
  - jupyter
  - matplotlib            # for plotting results
